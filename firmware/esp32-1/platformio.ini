[platformio]
default_envs = dev

; ─── 모든 env 공통 ───────────────────────────────
[env]
build_flags =
    -D SCHEMA_VERSION=1
    -D FW_VERSION=\"0.1.0\"
    -D MQTT_PORT=1883
    -D HEARTBEAT_MS=30000
    -D ACK_BUTTON_PIN=4

; ─── ESP32 보드 공통 (env 가 아니라 템플릿) ──────
[esp32_base]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    bertmelis/espMqttClient@^1.7.0
    adafruit/DHT sensor library@^1.4.6
    claws/BH1750@^1.3.0

; ─── 개발용 — 책상에 꽂힌 것에 맞춰 자유롭게 ─────
[env:dev]
extends = esp32_base
build_flags =
    ${env.build_flags}
    -D NODE_SENSORS=\"vs-07:power:button:5,vs-03l:light:ldr:34\"
    -D LDR_DARK_ADC=1100
    -D LDR_BRIGHT_ADC=3400
    -D LDR_DARK_LUX=50
    -D LDR_BRIGHT_LUX=800
    -D NODE_DEVICES=\"vd-10:display_node,vd-02:smart_light:25,vd-09:smart_light:26,vd-07:smart_light:27,vd-05:smart_fridge:19,vd-06:water_purifier:23,vd-13:cooktop:18\"

; ─── 최종 배치 ───────────────────────────────────
[env:node_a]
extends = esp32_base
build_flags =
    ${env.build_flags}
    -D NODE_SENSORS=\"vs-09:bed:fsr:34,vs-10:motion:pir:14\"
    -D NODE_DEVICES=\"\"

[env:node_b]
extends = esp32_base
build_flags =
    ${env.build_flags}
    -D NODE_SENSORS=\"vs-03:motion:pir:4,vs-05c:climate:dht11:15,vs-05l:light:bh1750:21,vs-06:door:reed:5,vs-08:power:ct:35\"
    -D NODE_DEVICES=\"\"

; ─── 맥에서 도는 테스트 ──────────────────────────
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    ${env.build_flags}
    -std=c++17
[platformio]
default_envs = dev

; ─── 모든 env 공통 ───────────────────────────────
[env]
build_flags =
    -D SCHEMA_VERSION=1
    -D FW_VERSION=\"0.1.0\"
    -D MQTT_HOST=\"172.20.10.2\"
    -D MQTT_PORT=1883
    -D HEARTBEAT_MS=30000

; ─── ESP32 보드 공통 (env 가 아니라 템플릿) ──────
[esp32_base]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    bertmelis/espMqttClient@^1.7.0

; ─── 개발용 — 책상에 꽂힌 것에 맞춰 자유롭게 ─────
[env:dev]
extends = esp32_base
build_flags =
    ${env.build_flags}
    -D NODE_SENSORS=\"vs-03:motion:pir:4,vs-06:door:reed:5\"
    -D NODE_DEVICES=\"vd-10:display_node\"

; ─── 최종 배치 ───────────────────────────────────
[env:node_a]
extends = esp32_base
build_flags =
    ${env.build_flags}
    -D NODE_SENSORS=\"vs-01:presence:ld2410c:16,vs-07:bed:fsr:34\"
    -D NODE_DEVICES=\"vd-10:display_node,vd-02:smart_light\"

[env:node_b]
extends = esp32_base
build_flags =
    ${env.build_flags}
    -D NODE_SENSORS=\"vs-03:motion:pir:4,vs-05c:climate:dht22:15,vs-05l:light:bh1750:21,vs-06:door:reed:5,vs-08:power:acs712:35\"
    -D NODE_DEVICES=\"\"

; ─── 맥에서 도는 테스트 ──────────────────────────
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    ${env.build_flags}
    -std=c++17